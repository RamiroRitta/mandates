[project]
name = "agentmandates"
version = "0.1.0"
description = "Spend mandates for AI agents: signed, verifiable limits on what an agent may pay, compatible with AP2."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "agentmandates" }]
keywords = ["ai-agents", "payments", "mandates", "ap2", "mcp", "mercadopago", "x402", "agentic-commerce"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "pydantic>=2.7",
  "cryptography>=42",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://example.invalid"
Repository = "https://github.com/RamiroRitta/mandates"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmandates"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
